<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>AI@Touro Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
<style>
  :root{ --bg:#14161c; --panel:#1b1e27; --panel2:#232733; --line:#2d3340; --ink:#eceef4; --ink2:#aab2c3; --mute:#7b8498; --accent:#E2574C; --accent2:#22D3EE; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5}
  a{color:var(--accent2)}
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px}
  /* gate */
  #gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .gate-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:34px 30px;box-shadow:0 30px 80px -30px rgba(0,0,0,.7)}
  .lockico{width:44px;height:44px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:16px}
  .gate-card h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.35rem;margin:0 0 4px}
  .gate-card p{color:var(--ink2);font-size:.92rem;margin:0 0 20px}
  .gate-form{display:flex;gap:8px}
  #pw{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:11px 13px;font:inherit;font-size:.95rem}
  #pw:focus{outline:none;border-color:var(--accent2)}
  .btn{background:var(--accent);border:0;border-radius:10px;color:#fff;font:inherit;font-weight:600;padding:11px 16px;cursor:pointer}
  .btn:hover{filter:brightness(1.08)}
  .btn--ghost{background:var(--panel2);border:1px solid var(--line);color:var(--ink)}
  #err{color:var(--accent);font-size:.85rem;margin-top:12px;min-height:1.1em}
  .foot{color:var(--mute);font-size:.72rem;margin-top:22px;line-height:1.5}
  /* hub */
  #hub{display:none;padding:0 0 80px}
  .topbar{position:sticky;top:0;z-index:5;background:rgba(20,22,28,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .topbar .wrap{display:flex;align-items:center;gap:14px;padding-top:14px;padding-bottom:14px}
  .pill{font-family:'Inter Tight';font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--accent);border:1px solid rgba(226,87,76,.45);border-radius:100px;padding:4px 10px;white-space:nowrap}
  .topbar h2{font-family:Fraunces,serif;font-weight:600;font-size:1.02rem;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lockbtn{background:var(--panel2);border:1px solid var(--line);color:var(--ink2);border-radius:9px;padding:7px 12px;font:inherit;font-size:.82rem;cursor:pointer}
  .lockbtn:hover{color:var(--ink)}
  .intro{color:var(--ink2);font-size:.95rem;margin:26px 0 10px;max-width:70ch}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:22px 0;overflow:hidden}
  .item__head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;padding:18px 20px 12px}
  .item__eyebrow{font-family:'Inter Tight';font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:600}
  .item__name{font-family:Fraunces,serif;font-weight:600;font-size:1.15rem;margin:0}
  .item__sub{color:var(--ink2);font-size:.9rem;width:100%;margin-top:-2px}
  .item__actions{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 16px}
  .framewrap{background:#fff;border-top:1px solid var(--line)}
  .framewrap.deck{aspect-ratio:16/9}
  .framewrap.doc{height:78vh}
  .framewrap iframe{width:100%;height:100%;border:0;display:block;background:#fff}
  .more{color:var(--mute);font-size:.85rem;text-align:center;border:1px dashed var(--line);border-radius:12px;padding:18px;margin-top:26px}
  .busy{color:var(--ink2);text-align:center;padding:40px}
</style>
</head>
<body>

<section id="gate">
  <div class="gate-card">
    <div class="lockico">&#128274;</div>
    <h1>AI@Touro Workshop</h1>
    <p>Smarter Than the Prompt. Enter the password to open the workshop.</p>
    <form class="gate-form" id="gateForm" autocomplete="off">
      <input id="pw" type="password" placeholder="Password" autocomplete="off" autofocus />
      <button class="btn" type="submit">Unlock</button>
    </form>
    <div id="err"></div>
    <p class="foot">Goran Trajkovski &middot; gorantrajkovski.com<br/>Contents are AES-256 encrypted and decrypt only in your browser with the correct password.</p>
  </div>
</section>

<main id="hub"></main>

const b64=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
async function deriveKey(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function unlock(pw){
  const key=await deriveKey(pw);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(CT)); // throws on wrong password
  return JSON.parse(new TextDecoder().decode(buf));
}
function blobUrl(html){return URL.createObjectURL(new Blob([html],{type:'text/html'}));}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function render(data){
  document.getElementById('gate').style.display='none';
  const hub=document.getElementById('hub');hub.style.display='block';
  const bar=el('div','topbar');const bw=el('div','wrap');
  bw.appendChild(el('span','pill','Confidential'));
  bw.appendChild(el('h2',null,data.title));
  const lb=el('button','lockbtn','&#128274; Lock');lb.onclick=()=>location.reload();bw.appendChild(lb);
  bar.appendChild(bw);hub.appendChild(bar);
  const main=el('div','wrap');
  main.appendChild(el('p','intro','Open the workshop, press play on each clip, and use Open full screen for a bigger view.'));
  data.items.forEach(it=>{
    const card=el('div','item');
    const head=el('div','item__head');
    head.appendChild(el('span','item__eyebrow',it.label));
    head.appendChild(el('h3','item__name',it.name));
    if(it.sub)head.appendChild(el('p','item__sub',it.sub));
    card.appendChild(head);
    const url = it.kind==='pdf'
      ? URL.createObjectURL(new Blob([b64(it.pdf)],{type:'application/pdf'}))
      : blobUrl(it.html);
    const fw=el('div','framewrap '+(it.kind==='deck'?'deck':'doc'));
    const fr=document.createElement('iframe');fr.src=url;fr.loading='lazy';fr.setAttribute('allow','fullscreen');fr.setAttribute('allowfullscreen','');fr.setAttribute('title',it.name);
    fw.appendChild(fr);
    const actions=el('div','item__actions');
    const open=el('button','btn','Open full screen \u2922');
    open.onclick=()=>{
      const req=fr.requestFullscreen||fr.webkitRequestFullscreen||fr.msRequestFullscreen;
      if(req){ try{ const r=req.call(fr); if(r&&r.catch) r.catch(()=>window.open(url,'_blank','noopener')); }catch(_){ window.open(url,'_blank','noopener'); } }
      else { window.open(url,'_blank','noopener'); }
    };
    actions.appendChild(open);
    if(it.docx||it.pdf){
      const bytes=it.docx?b64(it.docx):b64(it.pdf);
      const fname=it.docxName||it.pdfName;
      const mime=it.docx?'application/vnd.openxmlformats-officedocument.wordprocessingml.document':'application/pdf';
      const dl=el('button','btn btn--ghost',it.docx?'Download Word (.docx)':'Download PDF');
      dl.onclick=()=>{const u=URL.createObjectURL(new Blob([bytes],{type:mime}));const a=document.createElement('a');a.href=u;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);};
      actions.appendChild(dl);
    }
    card.appendChild(actions);
    card.appendChild(fw);
    main.appendChild(card);
  });
  main.appendChild(el('div','more','AI@Touro · Smarter Than the Prompt'));
  hub.appendChild(main);
}
document.getElementById('gateForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const err=document.getElementById('err');err.textContent='';
  const btn=e.target.querySelector('button');const pw=document.getElementById('pw').value;
  btn.disabled=true;btn.textContent='Unlocking…';
  try{ const data=await unlock(pw); render(data); }
  catch(_){ err.textContent='Incorrect password.'; btn.disabled=false;btn.textContent='Unlock'; document.getElementById('pw').select(); }
});
</script>
