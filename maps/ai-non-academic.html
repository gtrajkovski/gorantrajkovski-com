    <svg viewBox={`0 0 ${MW} ${MH}`} style={{width:"100%",maxWidth:MW,borderRadius:14,overflow:"hidden",boxShadow:"0 1px 3px rgba(0,0,0,.06),0 8px 30px rgba(0,0,0,.06)"}}>

      <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
        <Pill active={fq===0} color="#1a1a2e" onClick={()=>{setFq(0);setSel(null)}}>All {data.length}</Pill>
        {[1,2,3,4].map(q=><Pill key={q} active={fq===q} color={Q[q].color} onClick={()=>{setFq(fq===q?0:q);setSel(null)}}>{Q[q].icon} {Q[q].name}</Pill>)}
        <span style={{width:1,height:20,background:"#e0ddd8",margin:"0 4px"}}/>
        <select value={fr} onChange={e=>{setFr(e.target.value);setSel(null)}} style={{fontFamily:"'Manrope'",fontSize:11.5,padding:"5px 10px",borderRadius:8,border:"1.5px solid #ddd",background:"#fff",color:"#555",cursor:"pointer"}}><option value="All">All Regions</option>{regions.map(r=><option key={r} value={r}>{r}</option>)}</select>
        <select value={fb} onChange={e=>{setFb(e.target.value);setSel(null)}} style={{fontFamily:"'Manrope'",fontSize:11.5,padding:"5px 10px",borderRadius:8,border:"1.5px solid #ddd",background:"#fff",color:"#555",cursor:"pointer"}}><option value="All">All Buyers</option>{buyers.map(b=><option key={b} value={b}>{b}</option>)}</select>
        <span style={{fontFamily:"'IBM Plex Mono'",fontSize:11,color:"#aaa",marginLeft:6}}>{vis.length} shown</span>
      </div>
    </div>

    <div style={{maxWidth:1200,margin:"0 auto",padding:"20px 28px",display:"flex",gap:28,alignItems:"flex-start",flexWrap:"wrap"}}>
      <div style={{flex:"1 1 640px",minWidth:320,opacity:ready?1:0,transform:ready?"none":"translateY(16px)",transition:"all .8s cubic-bezier(.23,1,.32,1) .2s"}}>
        {view==="quadrant"?(<svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:W,borderRadius:14,background:"#fff",boxShadow:"0 1px 3px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.04)",border:"1px solid #ece9e3"}}>
          <rect x={pad.l} y={pad.t} width={iW/2} height={iH/2} fill={Q[3].bg}/><rect x={pad.l+iW/2} y={pad.t} width={iW/2} height={iH/2} fill={Q[1].bg}/><rect x={pad.l} y={pad.t+iH/2} width={iW/2} height={iH/2} fill={Q[4].bg}/><rect x={pad.l+iW/2} y={pad.t+iH/2} width={iW/2} height={iH/2} fill={Q[2].bg}/>
          {[.25,.75].map(v=><g key={v} opacity={.35}><line x1={px(v)} y1={pad.t} x2={px(v)} y2={H-pad.b} stroke="#ccc" strokeDasharray="2,4" strokeWidth={.5}/><line x1={pad.l} y1={py(v)} x2={W-pad.r} y2={py(v)} stroke="#ccc" strokeDasharray="2,4" strokeWidth={.5}/></g>)}
          <line x1={px(.5)} y1={pad.t} x2={px(.5)} y2={H-pad.b} stroke="#c4bfb6" strokeWidth={1}/><line x1={pad.l} y1={py(.5)} x2={W-pad.r} y2={py(.5)} stroke="#c4bfb6" strokeWidth={1}/>
          {[{q:3,lx:pad.l+iW*.13,ly:pad.t+iH*.08},{q:1,lx:pad.l+iW*.63,ly:pad.t+iH*.08},{q:4,lx:pad.l+iW*.13,ly:pad.t+iH*.58},{q:2,lx:pad.l+iW*.63,ly:pad.t+iH*.58}].map(({q,lx,ly})=>(<g key={q}><text x={lx} y={ly} fontFamily="'Source Serif 4',Georgia" fontSize={13} fontWeight={600} fill={Q[q].color} opacity={.18}>{Q[q].name}</text><text x={lx} y={ly+15} fontFamily="'Manrope',sans-serif" fontSize={8.5} fill={Q[q].color} opacity={.12}>{Q[q].sub}</text></g>))}
          <text x={W/2} y={H-8} textAnchor="middle" fontFamily="'Manrope',sans-serif" fontSize={10.5} fill="#999" fontWeight={500}>Credential & Employer Signaling →</text>
          <text x={10} y={H/2} textAnchor="middle" fontFamily="'Manrope',sans-serif" fontSize={10.5} fill="#999" fontWeight={500} transform={`rotate(-90,10,${H/2})`}>Hands-on Depth →</text>
          <text x={pad.l+2} y={H-pad.b+14} fontFamily="'IBM Plex Mono',monospace" fontSize={8} fill="#bbb">Low</text><text x={W-pad.r-2} y={H-pad.b+14} fontFamily="'IBM Plex Mono',monospace" fontSize={8} fill="#bbb" textAnchor="end">High</text>
          <text x={pad.l-4} y={H-pad.b-2} fontFamily="'IBM Plex Mono',monospace" fontSize={8} fill="#bbb" textAnchor="end">Low</text><text x={pad.l-4} y={pad.t+8} fontFamily="'IBM Plex Mono',monospace" fontSize={8} fill="#bbb" textAnchor="end">High</text>
          {vis.map(p=>{const cx=px(p.x),cy=py(p.y),r=rad(p),c=Q[p.q].color,isSel=sel?.id===p.id,isHov=hov===p.id,act=isSel||isHov,lines=splitLabel(p.name);return(<g key={p.id} onClick={()=>setSel(isSel?null:p)} onMouseEnter={()=>setHov(p.id)} onMouseLeave={()=>setHov(null)} style={{cursor:"pointer"}}>{act&&<circle cx={cx} cy={cy} r={r+5} fill="none" stroke={c} strokeWidth={1.5} opacity={.3} strokeDasharray={isSel?"none":"3,2"}/>}{p.notable&&!act&&<circle cx={cx} cy={cy} r={r+3} fill="none" stroke={c} strokeWidth={.5} opacity={.2}/>}<circle cx={cx} cy={cy} r={r} fill={isSel?c:"#fff"} stroke={c} strokeWidth={isSel?2.5:(act?2:1.2)} opacity={act?1:.9}/>{lines.map((line,i)=><text key={i} x={cx} y={cy+(i-(lines.length-1)/2)*(r>16?10:9)} textAnchor="middle" dominantBaseline="middle" fontFamily="'Manrope',sans-serif" fontSize={lines.length>1?(r>=17?7:6.5):(p.name.length>14?6.5:(r>=17?8:7))} fontWeight={600} fill={isSel?"#fff":c} style={{pointerEvents:"none"}}>{line}</text>)}</g>);})}
          {hov&&!sel&&(()=>{const p=data.find(d=>d.id===hov);if(!p)return null;const cx=px(p.x),cy=py(p.y),tw=190,th=44;let ttx=cx-tw/2,tty=cy-rad(p)-th-8;if(ttx<pad.l)ttx=pad.l+4;if(ttx+tw>W-pad.r)ttx=W-pad.r-tw-4;if(tty<pad.t)tty=cy+rad(p)+8;return(<g style={{pointerEvents:"none"}}><rect x={ttx} y={tty} width={tw} height={th} rx={7} fill="#1a1a2e" opacity={.93}/><text x={ttx+12} y={tty+17} fontFamily="'Manrope',sans-serif" fontSize={10.5} fontWeight={700} fill="#fff">{p.name}</text><text x={ttx+12} y={tty+32} fontFamily="'Manrope',sans-serif" fontSize={8.5} fill="#aaa">{p.tag}</text></g>);})()}
        </svg>):(
          <WorldMap programs={vis} sel={sel} setSel={setSel} hov={hov} setHov={setHov} activeRegion={fr} accent="#b8860b"/>
        )}
      </div>

      <div style={{flex:"0 1 400px",minWidth:290,opacity:ready?1:0,transform:ready?"none":"translateX(20px)",transition:"all .8s cubic-bezier(.23,1,.32,1) .35s"}}>
        {sel?(()=>{const q=Q[sel.q];return(<div style={{background:"#fff",borderRadius:14,padding:24,boxShadow:"0 1px 3px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.06)",border:`1px solid ${q.color}18`}}>
          <div style={{display:"inline-flex",alignItems:"center",gap:6,padding:"3px 12px",borderRadius:100,background:q.bg,border:`1px solid ${q.color}22`,marginBottom:14}}><span style={{fontFamily:"'IBM Plex Mono'",fontSize:9,fontWeight:600,color:q.color,letterSpacing:1.5,textTransform:"uppercase"}}>{q.icon} {q.name}</span></div>
          <h2 style={{fontFamily:"'Source Serif 4',Georgia",fontSize:26,fontWeight:700,color:"#1a1a2e",lineHeight:1.15,margin:"0 0 4px"}}>{sel.name}</h2>
          <p style={{fontFamily:"'Manrope'",fontSize:12,color:q.color,fontStyle:"italic",margin:"0 0 14px",fontWeight:500}}>{sel.tag}</p>
          <p style={{fontFamily:"'Manrope'",fontSize:13,color:"#555",lineHeight:1.65,margin:"0 0 18px"}}>{sel.desc}</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:18}}>
            {[{l:"Price",v:sel.price},{l:"Depth",v:sel.depth},{l:"Hands-on",v:sel.ho},{l:"Credential",v:sel.cred},{l:"Region",v:sel.r},{l:"Language",v:sel.lang}].map(({l,v})=>(<div key={l} style={{padding:"8px 12px",borderRadius:8,background:"#faf9f6",border:"1px solid #ece9e3"}}><div style={{fontFamily:"'IBM Plex Mono'",fontSize:9,color:"#aaa",letterSpacing:1,marginBottom:3}}>{l.toUpperCase()}</div><div style={{fontFamily:"'Manrope'",fontSize:12,color:"#333",fontWeight:600}}>{v}</div></div>))}
          </div>
          {[{l:"Credential Signal",v:sel.x},{l:"Hands-on Depth",v:sel.y}].map(({l,v})=>(<div key={l} style={{marginBottom:8}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontFamily:"'Manrope'",fontSize:11,color:"#888"}}>{l}</span><span style={{fontFamily:"'IBM Plex Mono'",fontSize:11,color:"#333",fontWeight:600}}>{Math.round(v*100)}</span></div><div style={{height:4,background:"#ece9e3",borderRadius:2}}><div style={{height:"100%",width:`${v*100}%`,borderRadius:2,background:q.color,transition:"width .4s cubic-bezier(.23,1,.32,1)"}}/></div></div>))}
          <a href={sel.url} target="_blank" rel="noopener noreferrer" style={{display:"block",marginTop:16,padding:"10px 16px",borderRadius:8,background:q.color,color:"#fff",fontFamily:"'Manrope'",fontSize:12.5,fontWeight:600,textAlign:"center",textDecoration:"none",cursor:"pointer",letterSpacing:.3}}>Visit Platform →</a>
          <div style={{marginTop:10,padding:"12px 14px",borderRadius:10,background:q.bg,border:`1px solid ${q.color}15`}}><div style={{fontFamily:"'IBM Plex Mono'",fontSize:9,color:q.color,letterSpacing:1.5,marginBottom:4}}>ACTION RULE</div><div style={{fontFamily:"'Manrope'",fontSize:12,color:"#555",lineHeight:1.5}}>{q.rule}</div></div>
          <button onClick={()=>setSel(null)} style={{marginTop:12,width:"100%",padding:"9px",borderRadius:8,border:"1.5px solid #e0ddd8",background:"#faf9f6",color:"#999",fontSize:12,cursor:"pointer",fontWeight:500}}>Close</button>
        </div>);})():(
          <div>
            <div style={{background:"#fff",borderRadius:14,padding:22,marginBottom:16,boxShadow:"0 1px 3px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.04)",border:"1px solid #ece9e3"}}>
              <h3 style={{fontFamily:"'Source Serif 4',Georgia",fontSize:18,fontWeight:600,color:"#1a1a2e",margin:"0 0 4px"}}>Which quadrant is for you?</h3>
              <p style={{fontFamily:"'Manrope'",fontSize:11,color:"#999",margin:"0 0 14px"}}>{view==="map"?"Select a region to highlight on the globe":"Credential × Hands-on view"}</p>
              {[{q:1,who:"Need job-change proof in 8–16 weeks",pick:"Ship & Signal"},{q:2,who:"Need recognized certs for non-engineers",pick:"Credential Fast"},{q:3,who:"Already code, want fastest skill growth",pick:"Build & Prove"},{q:4,who:"Still choosing a direction",pick:"Explore & Orient"}].map(({q,who,pick})=>(<div key={q} onClick={()=>setFq(fq===q?0:q)} style={{display:"flex",gap:12,padding:"10px 14px",marginBottom:6,borderRadius:10,cursor:"pointer",background:fq===q?Q[q].bg:"transparent",border:`1.5px solid ${fq===q?Q[q].color+"30":"transparent"}`,transition:"all .2s ease"}}><span style={{width:28,height:28,borderRadius:8,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",background:Q[q].color+"12",color:Q[q].color,fontFamily:"'IBM Plex Mono'",fontSize:14,fontWeight:700}}>{Q[q].icon}</span><div><div style={{fontFamily:"'Manrope'",fontSize:13,color:"#333",fontWeight:600,lineHeight:1.3}}>{who}</div><div style={{fontFamily:"'IBM Plex Mono'",fontSize:11,color:Q[q].color,fontWeight:500,marginTop:2}}>→ {pick}</div></div></div>))}
            </div>
            <div style={{background:"#fff",borderRadius:14,padding:20,boxShadow:"0 1px 3px rgba(0,0,0,.04),0 4px 20px rgba(0,0,0,.03)",border:"1px solid #ece9e3"}}>
              <div style={{fontFamily:"'IBM Plex Mono'",fontSize:9,letterSpacing:2,color:"#aaa",marginBottom:12}}>READING THE MAP</div>
              {[{t:"Toggle views",d:"Switch between quadrant chart and geographic map. Both respond to filters."},{t:"Region filter",d:"Select a region to highlight countries on the globe and filter providers."},{t:"Dot color",d:"Matches quadrant assignment. Notable providers have a halo."},{t:"Click through",d:"Click a provider → 'Visit Platform →' to go to their site."}].map(({t,d})=>(<div key={t} style={{marginBottom:8}}><span style={{fontFamily:"'Manrope'",fontSize:12,fontWeight:700,color:"#333"}}>{t}. </span><span style={{fontFamily:"'Manrope'",fontSize:12,color:"#777"}}>{d}</span></div>))}
            </div>
          </div>
        )}
      </div>
    </div>

    <div style={{maxWidth:1200,margin:"0 auto",padding:"0 28px 20px",opacity:ready?1:0,transition:"all .8s ease .5s"}}>
      <div style={{background:"#fff",borderRadius:14,padding:20,boxShadow:"0 1px 3px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.04)",border:"1px solid #ece9e3",overflowX:"auto"}}>
        <div style={{display:"flex",alignItems:"baseline",gap:10,marginBottom:14}}>
          <h3 style={{fontFamily:"'Source Serif 4',Georgia",fontSize:18,fontWeight:600,color:"#1a1a2e"}}>Full Directory</h3>
          <span style={{fontFamily:"'IBM Plex Mono'",fontSize:11,color:"#aaa"}}>{vis.length} providers</span>
        </div>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead><tr>{["Platform","Quadrant","Region","Price","Hands-on","Credential"].map(h=><th key={h} style={{padding:"8px 12px",textAlign:"left",borderBottom:"2px solid #ece9e3",fontFamily:"'IBM Plex Mono'",fontSize:9,letterSpacing:1.2,color:"#aaa",fontWeight:500,textTransform:"uppercase",whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
          <tbody>{vis.map((p,i)=>{const q=Q[p.q],isSel=sel?.id===p.id;return(<tr key={p.id} onClick={()=>setSel(isSel?null:p)} style={{cursor:"pointer",background:isSel?q.bg:(i%2===0?"#faf9f6":"#fff"),transition:"background .15s ease"}}><td style={{padding:"8px 12px",fontFamily:"'Manrope'",fontSize:12.5,fontWeight:600,color:"#333",whiteSpace:"nowrap"}}>{p.notable&&<span style={{color:q.color,marginRight:4,fontSize:8}}>●</span>}{p.name}</td><td style={{padding:"8px 12px"}}><span style={{display:"inline-block",padding:"2px 10px",borderRadius:100,background:q.bg,border:`1px solid ${q.color}20`,fontFamily:"'IBM Plex Mono'",fontSize:9.5,fontWeight:600,color:q.color,whiteSpace:"nowrap"}}>{q.icon} {q.name}</span></td><td style={{padding:"8px 12px",fontFamily:"'Manrope'",fontSize:11,color:"#888",whiteSpace:"nowrap"}}>{p.r}</td><td style={{padding:"8px 12px",fontFamily:"'Manrope'",fontSize:11,color:"#666",whiteSpace:"nowrap"}}>{p.price}</td><td style={{padding:"8px 12px",fontFamily:"'Manrope'",fontSize:11,color:"#666"}}>{p.ho}</td><td style={{padding:"8px 12px",fontFamily:"'Manrope'",fontSize:11,color:"#666",maxWidth:140,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.cred}</td></tr>);})}</tbody>
        </table>
      </div>
    </div>

    <div style={{maxWidth:1200,margin:"0 auto",padding:"0 28px 48px"}}>
      <div style={{borderTop:"1px solid #ece9e3",paddingTop:20}}>
        <p style={{fontFamily:"'Manrope',sans-serif",fontSize:11,color:"#b0a99f",lineHeight:1.7,maxWidth:720}}>
          <span style={{fontFamily:"'IBM Plex Mono'",fontSize:9,letterSpacing:1.5,color:"#c4bfb6",textTransform:"uppercase"}}>Disclaimer</span><br/>
          The positions, ratings, and assessments on this page reflect one person's working evaluation based on personal research and experience. This is not legal, financial, or professional advice. Platform details — including pricing, content, and credentials — change frequently; always verify directly with the provider before making any decisions. No platform has endorsed, sponsored, or reviewed its placement here. Use this as a starting point for your own research, not as a definitive ranking.
        </p>
        <p style={{fontFamily:"'IBM Plex Mono'",fontSize:10,color:"#c4bfb6",marginTop:10}}>© 2026 Goran Trajkovski · gorantrajkovski.com</p>
      </div>
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
